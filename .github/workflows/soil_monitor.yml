name: Soil Moisture Monitor

on:
  schedule:
    # Runs every 31 minutes
    - cron: '*/31 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Restore Alert State Cache
      uses: actions/cache/restore@v4
      with:
        path: alert_state.json
        key: alert-state-${{ github.run_id }}
        restore-keys: |
          alert-state-

    - name: Run Soil Monitor (Cron Mode)
      run: python main.py --mode cron
      env:
        SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        MY_EMAIL: ${{ secrets.MY_EMAIL }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    - name: Save Alert State Cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: alert_state.json
        key: alert-state-${{ github.run_id }}
